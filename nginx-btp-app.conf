map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream definition for better load balancing and failover
upstream btp_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    server_name marocinfra.com www.marocinfra.com 162.55.219.151;
    
    root /var/www/btp-app;
    index index.html;

    # ============================================
    # 🔴 IMPORTANT: Large file uploads (500MB for bulk photos)
    # ============================================
    client_max_body_size 500M;

    # Increase timeouts for slow connections and large uploads
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Serve uploaded files from backend
    location /uploads/ {
        proxy_pass http://btp_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        
        # Cache static files
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # CORS headers for Electron desktop app
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # Backend API - use upstream with explicit IPv4
    location /api/ {
        proxy_pass http://btp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        add_header Access-Control-Expose-Headers "X-New-Token" always;
        
        # Large file uploads for photos
        client_max_body_size 500M;
        proxy_request_buffering off;
    }

    # Socket.IO WebSocket
    location /socket.io {
        proxy_pass http://btp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MinIO Storage - use explicit IPv4
    location /storage {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500M;
    }

    # ============================================
    # 🔴 CRITICAL: No-cache for index.html
    # Ensures users always get the latest version after deploy
    # ============================================
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri /index.html;
    }

    # Service Worker - MUST NOT be cached (triggers updates)
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Workbox runtime - same no-cache
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Manifest - short cache
    location = /manifest.webmanifest {
        add_header Cache-Control "max-age=60" always;
    }

    # Static assets with hash in name - long immutable cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Frontend SPA - handle all other routes (no-cache for HTML navigation)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/marocinfra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marocinfra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.marocinfra.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = marocinfra.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name marocinfra.com www.marocinfra.com 162.55.219.151;
    return 404;
}
