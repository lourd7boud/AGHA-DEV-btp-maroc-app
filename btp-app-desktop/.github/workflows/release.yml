name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend-web/package-lock.json
            btp-app-desktop/package-lock.json
      
      - name: Install frontend-web dependencies
        working-directory: frontend-web
        run: npm ci
      
      - name: Build frontend-web
        working-directory: frontend-web
        run: npm run build
      
      - name: Install desktop dependencies
        working-directory: btp-app-desktop
        run: npm ci
      
      - name: Build for ${{ matrix.platform }}
        working-directory: btp-app-desktop
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            btp-app-desktop/release/*.exe
            btp-app-desktop/release/*.dmg
            btp-app-desktop/release/*.AppImage
            btp-app-desktop/release/*.deb
            btp-app-desktop/release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
